# Append to ~/.tmux.conf.
# Trigger 2 of 3: a popup when a client attaches. Prefix+V forces one.
# (Trigger 3, the hourly clock, is launchd and needs no tmux config.)

set-hook -g client-attached 'run-shell -b "~/.tmux/scripts/vim-drill-popup.sh"'
bind-key V run-shell -b "~/.tmux/scripts/vim-drill-popup-force.sh"

# Popup clipboard: mouse-drag or y/Enter in copy mode writes to the macOS
# clipboard. Cmd-V pastes through the terminal into the active prompt/editor.
set -g mouse on
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
