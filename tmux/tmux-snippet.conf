# Append to ~/.tmux.conf.
# Trigger 2 of 3: a popup when a client attaches. Prefix+V forces one.
# (Trigger 3, the hourly clock, is launchd and needs no tmux config.)

set-hook -g client-attached 'run-shell -b "~/.tmux/scripts/vim-drill-popup.sh"'
bind-key V run-shell -b "~/.tmux/scripts/vim-drill-popup-force.sh"
